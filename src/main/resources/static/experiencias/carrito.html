<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito · Xperiabox</title>
    <link rel="stylesheet" href="/experiencias/css/experiencia.css">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/carrito.css">
    <link rel="stylesheet" href="css/carrito-page.css">
    <style>
        .precio-cambio { color: #856404; background:#fff3cd; padding:4px 8px; border-radius:5px; font-size:.82rem; margin:4px 0; }
    </style>
</head>
<body>

    <div class="carrito-page">

        <!-- ESTADO VACÍO -->
        <div class="cart-empty-state" id="emptyCart">
            <h1>🛒 Tu carrito está vacío</h1>
            <p>Añade experiencias desde el catálogo para verlas aquí.</p>
            <div class="cart-actions">
                <a href="/experiencias/login.html" class="btn-main" id="btn-login-carrito">Iniciar Sesión</a>
                <a href="/experiencias/index.html" class="btn-secondary">Ver experiencias</a>
            </div>
        </div>

        <!-- PRODUCTOS DEL CARRITO -->
        <div id="cartProducts" style="display:none;">
            <h1>🛒 Tu Carrito</h1>
            <div id="productsList"></div>
            <div class="cart-total-box">
                <h2 id="totalCarrito"></h2>
                <button class="btn-main" id="btn-finalizar" onclick="abrirModalCompra()">💳 Finalizar compra</button>
            </div>
        </div>

    </div>

    <!-- ── Modal paso a paso ── -->
    <div id="modal-compra" class="modal-compra-overlay">
        <div class="modal-compra-box">

            <div class="modal-progreso">
                <div class="modal-progreso-bar" id="modal-progreso-bar"></div>
            </div>

            <p class="modal-paso-label" id="modal-paso-label">Experiencia 1 de 1</p>
            <h2 class="modal-nombre-exp" id="modal-nombre-exp"></h2>
            <p class="modal-precio-exp" id="modal-precio-exp"></p>

            <div id="modal-compra-error" class="modal-compra-error" style="display:none;"></div>

            <label for="input-fecha">📅 Fecha y hora de la experiencia</label>
            <input type="datetime-local" id="input-fecha">

            <div class="modal-compra-actions">
                <button class="btn-cancelar-modal" onclick="cerrarModalCompra()">Cancelar</button>
                <button class="btn-siguiente-modal" id="btn-siguiente" onclick="siguientePaso()">
                    Siguiente →
                </button>
            </div>

        </div>
    </div>


    <script>
        // Ocultar "Iniciar Sesión" si hay sesión activa
        fetch('/api/auth/me', { credentials: 'include' })
            .then(res => res.ok ? res.json() : null)
            .then(user => {
                const btnLogin = document.getElementById('btn-login-carrito');
                if (user && btnLogin) btnLogin.style.display = 'none';
            })
            .catch(() => {});
    </script>
    <script src="/experiencias/js/navbar.js"></script>
    <script src="/experiencias/js/carrito.js"></script>
</body>
</html>
