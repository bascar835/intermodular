<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva experiencia | Xperiabox Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin-layout.css">
</head>
<body>

    <div class="admin-main">
        <div class="admin-topbar">
            <span class="page-title">Nueva experiencia</span>
            <div class="topbar-user"><span>👤</span><span class="user-name">Admin</span></div>
        </div>
        <div class="admin-content">
            <div class="admin-card" style="padding:24px;">
                <form class="admin-form" onsubmit="guardar(event)">

                    <div class="form-group">
                        <label>Título <span class="required-star">*</span></label>
                        <input id="titulo" required>
                    </div>
                    <div class="form-group">
                        <label>Descripción <span class="required-star">*</span></label>
                        <textarea id="descripcion"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Precio (€) <span class="required-star">*</span></label>
                        <input id="precio" type="number" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Ubicación <span class="required-star">*</span></label>
                        <input id="ubicacion">
                    </div>
                    <div class="form-group">
                        <label>Duración (horas) <span class="required-star">*</span></label>
                        <input id="duracion_horas" type="number" required>
                    </div>
                    <div class="form-group">
                        <label>Categoría <span class="required-star">*</span></label>
                        <select id="categoria_id"></select>
                    </div>
                    <div class="form-group">
                        <label>¿Qué te recomendamos? <span class="field-optional">(opcional)</span></label>
                        <textarea id="recomendamos" placeholder="Escribe las recomendaciones para esta experiencia..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>¿Qué incluye? <span class="field-optional">(opcional)</span></label>
                        <textarea id="incluye" placeholder="Describe qué está incluido en esta experiencia..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Imagen <span class="field-optional">(opcional)</span></label>
                        <input id="imagen" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewImagen()">
                        <img id="preview" style="display:none;margin-top:10px;max-width:200px;border-radius:6px;">
                    </div>

                    <div id="form-error" style="display:none;"></div>
                    <button class="btn-primary" type="submit">Guardar</button>
                    <a href="index.html" class="btn-primary" style="background:#6b7280;margin-left:8px;">Cancelar</a>
                </form>
            </div>
        </div>
    </div>

<script src="/js/auth.js"></script>
<script src="/admin/js/form-validation.js"></script>
<script src="js/create.js"></script>
<script src="/admin/js/admin-sidebar.js"></script>
</body>
</html>
