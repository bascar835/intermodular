<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar categoría | Xperiabox Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/admin-layout.css">
</head>
<body>
    <div class="admin-main">
        <div class="admin-topbar">
            <span class="page-title">Editar categoría</span>
            <div class="topbar-user"><span>👤</span><span class="user-name">Admin</span></div>
        </div>
        <div class="admin-content">
            <div class="admin-card" style="padding:24px;">
                <form class="admin-form" onsubmit="guardar(event)">
                    <div class="form-group">
                        <label>Nombre <span class="required-star">*</span></label>
                        <input id="nombre" required>
                    </div>
                    <div class="form-group">
                        <label>Descripción <span class="required-star">*</span></label>
                        <textarea id="descripcion"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Imagen actual <span class="field-optional">(opcional)</span></label>
                        <div>
                            <img id="imagen-actual" style="display:none;max-width:200px;border-radius:6px;margin-bottom:8px;">
                            <span id="sin-imagen" style="color:#9ca3af;font-size:0.9em;">Sin imagen</span>
                        </div>
                        <label style="margin-top:8px;display:block;">Cambiar imagen (opcional)</label>
                        <input id="imagen" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewImagen()">
                        <img id="preview" style="display:none;margin-top:10px;max-width:200px;border-radius:6px;">
                    </div>
                    <div class="form-group">
                        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
                            <input id="activo" type="checkbox" style="width:18px;height:18px;cursor:pointer;">
                            Categoría activa
                        </label>
                        <small style="color:#6b7280;">Las categorías inactivas no aparecen en el frontend ni permiten crear experiencias.</small>
                    </div>
                    <div id="form-error" style="color:#c00;background:#fff0f0;border:1px solid #f99;border-radius:6px;padding:10px 14px;margin-bottom:12px;display:none;"></div>
                    <button class="btn-primary" type="submit">Guardar</button>
                    <a href="index.html" class="btn-primary" style="background:#6b7280;margin-left:8px;">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
<script src="/js/auth.js"></script>
<script src="/admin/js/form-validation.js"></script>
<script src="js/edit.js"></script>
<script src="/admin/js/admin-sidebar.js"></script>
</body>
</html>
